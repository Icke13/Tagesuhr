<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tagesuhr">
<meta name="theme-color" content="#111827">
<title>Meine Tagesuhr</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  width: 100%;
  background: #111827;
  color: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
}
body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
}
.screen {
  width: 100%;
  max-width: 1400px;
  padding: 4vh 3vw;
}
.top {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.5fr);
  align-items: center;
  gap: 12px;
  min-height: 36vh;
}
.weekday {
  font-size: 70px;
  font-weight: bold;
  line-height: 1.05;
}
.date {
  font-size: 44px;
  font-weight: bold;
  color: #7dd3fc;
  text-align: center;
  white-space: nowrap;
}
.right {
  display: flex;
  align-items: baseline;
  justify-content: flex-end;
  gap: 8px;
  white-space: nowrap;
}
.clock {
  font-size: 100px;
  font-weight: bold;
  letter-spacing: -5px;
  line-height: 1;
}
.period-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
}
.period-icon { font-size: 36px; }
.period { font-size: 30px; font-weight: bold; }

.note-wrap { margin-top: 4vh; }
.note-label {
  font-size: 60px;
  font-weight: bold;
  line-height: 1.1;
  color: #ffffff;
  margin-bottom: 18px;
}
textarea {
  display: block;
  width: 100%;
  min-height: 24vh;
  resize: vertical;
  border: 3px solid #64748b;
  border-radius: 14px;
  background: #f8fafc;
  color: #111827;
  padding: 18px;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 64px;
  font-weight: bold;
  line-height: 1.15;
  outline: none;
}
textarea:focus { border-color: #93c5fd; }
.hint {
  margin-top: 10px;
  color: #94a3b8;
  font-size: 18px;
}

/* Feste Pixel-Schriftgrößen: kompatibel mit Safari unter iOS 12. */
@media screen and (max-width: 900px) {
  .screen { padding: 3vh 3vw; }
  .top { gap: 8px; min-height: 32vh; }
  .weekday { font-size: 52px; }
  .date { font-size: 38px; }
  .clock { font-size: 80px; letter-spacing: -3px; }
  .period-icon { font-size: 27px; }
  .period { font-size: 22px; }
  .note-wrap { margin-top: 3vh; }
  .note-label { font-size: 64px; }
  textarea { font-size: 64px; }
}
@media screen and (max-width: 650px) {
  .screen { padding: 3vh 5vw; }
  .top {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 14px;
  }
  .weekday { font-size: 46px; }
  .date { font-size: 32px; }
  .right { width: 100%; justify-content: space-between; }
  .clock { font-size: 70px; }
  .period { font-size: 22px; }
  .note-label { font-size: 42px; }
  textarea { font-size: 40px; }
}
</style>
</head>
<body>
<main class="screen">
  <section class="top" aria-label="Wochentag, Datum und Uhrzeit">
    <div class="weekday" id="weekday">Montag</div>
    <div class="date" id="date">01.11.2026</div>
    <div class="right">
      <div class="clock" id="clock">00:00</div>
      <div class="period-wrap">
        <span class="period-icon" id="periodIcon" aria-hidden="true">🌙</span>
        <span class="period" id="period">nachts</span>
      </div>
    </div>
  </section>

  <section class="note-wrap">
    <div class="note-label">Notiz / Erinnerung</div>
    <textarea id="note" placeholder="Hier steht die Erinnerung ..." aria-label="Freitext"></textarea>
    <div class="hint">Der Text wird auf diesem iPad automatisch gespeichert.</div>
  </section>
</main>

<script>
(function () {
  var weekdays = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
  var clock = document.getElementById("clock");
  var weekday = document.getElementById("weekday");
  var date = document.getElementById("date");
  var period = document.getElementById("period");
  var periodIcon = document.getElementById("periodIcon");
  var note = document.getElementById("note");

  function updateClock() {
    var now = new Date();
    var h = now.getHours();
    var m = now.getMinutes();

    weekday.textContent = weekdays[now.getDay()];
    var day = (now.getDate() < 10 ? "0" : "") + now.getDate();
    var month = (now.getMonth() + 1 < 10 ? "0" : "") + (now.getMonth() + 1);
    date.textContent = day + "." + month + "." + now.getFullYear();
    clock.textContent = (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;

    var label, color, icon;
    if (h >= 6 && h < 9) {
      label = "morgens"; color = "#facc15"; icon = "🌅";
    } else if (h >= 9 && h < 12) {
      label = "vormittags"; color = "#7dd3fc"; icon = "☀️";
    } else if (h >= 12 && h < 14) {
      label = "mittags"; color = "#2563eb"; icon = "☀️";
    } else if (h >= 14 && h < 18) {
      label = "Nachmittag"; color = "#f59e0b"; icon = "🌇";
    } else if (h >= 18 && h < 23) {
      label = "Abends"; color = "#dc2626"; icon = "🌇";
    } else {
      label = "nachts"; color = "#6b7280"; icon = "🌙";
    }
    period.textContent = label;
    period.style.color = color;
    periodIcon.textContent = icon;
  }

  try {
    note.value = localStorage.getItem("meineTagesuhrNotiz") || "";
    note.addEventListener("input", function () {
      try { localStorage.setItem("meineTagesuhrNotiz", note.value); } catch (e) {}
    });
  } catch (e) {}

  updateClock();
  window.setInterval(updateClock, 1000);
}());
</script>
</body>
</html>
